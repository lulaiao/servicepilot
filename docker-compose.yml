services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: servicepilot
      POSTGRES_USER: servicepilot
      POSTGRES_PASSWORD: servicepilot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicepilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - servicepilot-postgres:/var/lib/postgresql/data

volumes:
  servicepilot-postgres:

